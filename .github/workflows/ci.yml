name: CI

on:
  schedule:
    - cron: '0 2 * * 1'
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - "main"

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    # Skip on release-please PRs (code was already tested in the original PR)
    if: ${{ !startsWith(github.head_ref || '', 'release-please--') }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Purge badge cache
        uses: kevincobain2000/action-camo-purge@v1
        continue-on-error: true  # Don't fail on fork PRs

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-mock coverage
          pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: |
          coverage run -m pytest -m "not integration and not slow" -v
          coverage report
