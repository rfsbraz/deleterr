name: Validate Docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'app/schema.py'
      - 'scripts/generate_docs.py'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv sync --locked --no-default-groups --group docs
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Generate docs from schema
        run: python -m scripts.generate_docs

      - name: Build MkDocs
        run: mkdocs build --strict
