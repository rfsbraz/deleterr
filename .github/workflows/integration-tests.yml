name: Integration Tests

on:
  schedule:
    - cron: '0 2 * * 1'
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - "main"

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip on release-please PRs (code was already tested in the original PR)
    if: ${{ !startsWith(github.head_ref || '', 'release-please--') }}
    env:
      # Same secrets as docker-image.yml. Empty on fork PRs (and on Dependabot
      # PRs if they aren't set as Dependabot secrets); pulls are then anonymous.
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout
          pip install -r requirements.txt

      - name: Create Tautulli database
        run: |
          cd tests/integration/seed_data/tautulli
          python create_db.py

      # Authenticated pulls avoid Docker Hub's anonymous rate limit
      # ("toomanyrequests", e.g. scheduled run 38227113447).
      - name: Log in to Docker Hub
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Pre-pull Docker Compose images
        run: |
          cd tests/integration
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.integration.yml pull --ignore-buildable \
              && docker compose -f docker-compose.integration.yml build --pull; then
              echo "Images ready (attempt $attempt)"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 30))
              echo "::warning::Image pull failed (attempt $attempt/3), retrying in ${delay}s"
              sleep "$delay"
            fi
          done
          echo "::error::Image pull failed after 3 attempts"
          exit 1

      - name: Start Docker Compose services
        run: |
          cd tests/integration
          docker compose -f docker-compose.integration.yml up -d

      - name: Fix volume permissions for linuxserver containers
        run: |
          # linuxserver.io containers run as user abc (UID 1000)
          docker exec deleterr-test-radarr chown -R abc:abc /movies || true
          docker exec deleterr-test-sonarr chown -R abc:abc /tv || true
          docker exec deleterr-test-radarr mkdir -p /movies && docker exec deleterr-test-radarr chown abc:abc /movies || true
          docker exec deleterr-test-sonarr mkdir -p /tv && docker exec deleterr-test-sonarr chown abc:abc /tv || true

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."

          echo "Waiting for Plex..."
          timeout 120 bash -c 'until curl -sf http://localhost:32400/identity; do sleep 2; done'
          echo "Plex is ready"

          echo "Waiting for Radarr..."
          timeout 120 bash -c 'until curl -sf http://localhost:7878/ping; do sleep 2; done'
          echo "Radarr is ready"

          echo "Waiting for Sonarr..."
          timeout 120 bash -c 'until curl -sf http://localhost:8989/ping; do sleep 2; done'
          echo "Sonarr is ready"

          echo "Waiting for Tautulli..."
          timeout 120 bash -c 'until curl -sf http://localhost:8181/status; do sleep 2; done'
          echo "Tautulli is ready"

          echo "All services are ready!"

      - name: Run integration tests
        run: pytest tests/integration/ -v --timeout=300 -m integration
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Collect Docker logs on failure
        if: failure()
        run: |
          cd tests/integration
          echo "=== JustWatch Proxy logs ===" && docker compose -f docker-compose.integration.yml logs justwatch-proxy || true
          echo "=== Radarr logs ===" && docker compose -f docker-compose.integration.yml logs radarr || true
          echo "=== Sonarr logs ===" && docker compose -f docker-compose.integration.yml logs sonarr || true
          echo "=== Tautulli logs ===" && docker compose -f docker-compose.integration.yml logs tautulli || true
          echo "=== Plex logs ===" && docker compose -f docker-compose.integration.yml logs plex || true

      - name: Stop Docker Compose services
        if: always()
        run: |
          cd tests/integration
          docker compose -f docker-compose.integration.yml down -v --remove-orphans
