[project]
name = "deleterr"
version = "0.2.24"
description = "Intelligent media library cleanup for Plex, with user-friendly Leaving Soon notifications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "PlexAPI==4.15.16",
    "pydantic>=2.13.4",
    "pyarr==5.2.0",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "tautulli==4.7.1.2170",
    "trakt.py==4.4.0",
    "simple-justwatch-python-api==0.13",
    "APScheduler>=3.11.2",
    "Jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "coverage",
    "pytest",
    "pytest-mock==3.15.1",
    "pytest-timeout",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocs-minify-plugin>=0.8.0",
]

[tool.uv]
package = false
