[project]
name = "deleterr"
version = "0.2.26"
description = "Intelligent media library cleanup for Plex, with user-friendly Leaving Soon notifications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "PlexAPI==4.15.16",
    "pydantic>=2.14.0",
    "pyarr==5.2.0",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "tautulli==4.8.2.2180",
    "trakt.py==4.4.0",
    "simple-justwatch-python-api==0.13",
    "APScheduler>=3.11.3",
    "Jinja2>=3.1.6",
]

[project.scripts]
deleterr = "app.deleterr:main"

[dependency-groups]
dev = [
    "coverage",
    "pytest",
    "pytest-mock==3.16.0",
    "pytest-timeout",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-minify-plugin>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Security overrides for transitive pins that block patched versions.
# tautulli -> objectrest pins httpx==0.23.* (so httpcore 0.16, h11 0.14) and
# oauthlib==3.2.1; tautulli pins python-dotenv==1.0.* but never imports it.
# Remove these once tautulli/objectrest relax their pins.
override-dependencies = [
    "httpx>=0.28.1",          # GHSA-vqfr-h8mv-ghfj via h11 >= 0.16.0
    "h11>=0.16.0",            # GHSA-vqfr-h8mv-ghfj
    "oauthlib>=4.0.0",        # GHSA-3pgj-pg6c-r5p7, GHSA-hj66-6f7g-4r5v, GHSA-xpv3-w29h-x7cv
    "python-dotenv>=1.2.2",   # GHSA-mf9w-mj56-hr94
]
